<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Absensi - Screenshot to URL</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(102, 126, 234, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(118, 75, 162, 0.08) 0%, transparent 50%);
            z-index: 0;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            margin-top: 6px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            font-size: 14px;
            color: #fff;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            min-width: 200px;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(72, 187, 120, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #fc8181 0%, #e53e3e 100%);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(252, 129, 129, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 16px 0;
        }

        .status-box .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-box .value {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            margin-top: 4px;
            word-break: break-all;
        }

        .status-box .value.success {
            color: #68d391;
        }

        .status-box .value.error {
            color: #fc8181;
        }

        .status-box .value.loading {
            color: #63b3ed;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 13px;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert.success {
            display: block;
            background: rgba(72, 187, 120, 0.12);
            color: #68d391;
            border: 1px solid rgba(72, 187, 120, 0.15);
        }

        .alert.error {
            display: block;
            background: rgba(252, 129, 129, 0.12);
            color: #fc8181;
            border: 1px solid rgba(252, 129, 129, 0.15);
        }

        .alert.loading {
            display: block;
            background: rgba(99, 179, 237, 0.12);
            color: #63b3ed;
            border: 1px solid rgba(99, 179, 237, 0.15);
        }

        .alert.info {
            display: block;
            background: rgba(182, 148, 244, 0.12);
            color: #b794f4;
            border: 1px solid rgba(182, 148, 244, 0.15);
        }

        .iframe-container {
            margin-top: 16px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.04);
            background: rgba(255, 255, 255, 0.02);
            min-height: 350px;
            position: relative;
        }

        .iframe-container iframe {
            width: 100%;
            height: 450px;
            border: none;
            background: #fff;
            display: block;
        }

        .iframe-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.15);
            text-align: center;
            pointer-events: none;
        }

        .iframe-placeholder .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }

        .iframe-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .iframe-loading.visible {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .iframe-loading .label {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
        }

        .cookie-box {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 12px;
            max-height: 70px;
            overflow-y: auto;
        }

        .cookie-box .label {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cookie-box .value {
            color: rgba(255, 255, 255, 0.25);
            font-size: 10px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }

        .cookie-box .value.success {
            color: #68d391;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-top: 12px;
            display: none;
            align-items: center;
            gap: 14px;
        }

        .profile-card.visible {
            display: flex;
        }

        .profile-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
            flex-shrink: 0;
        }

        .profile-info .name {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
        }

        .profile-info .school {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .profile-info .id {
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
        }

        .badge-verified {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 1px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
            margin-left: 6px;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.08);
            font-size: 11px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        @media (max-width: 600px) {
            .container { padding: 24px; }
            .input-group { flex-direction: column; }
            .input-group input { width: 100%; }
            .btn { width: 100%; text-align: center; }
            .iframe-container iframe { height: 350px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">📸</div>
            <h1>Auto Absensi</h1>
            <p class="subtitle">Screenshot → URL → Load dengan Cookie → Absen Otomatis</p>
        </div>

        <!-- Input -->
        <div class="input-group">
            <input type="url" id="urlInput" value="https://diy.geschool.net/_k/1020423-vAH8nDt/" placeholder="URL absensi...">
            <button class="btn btn-primary" onclick="process()">🚀 Proses</button>
            <button class="btn btn-success" onclick="loadUrlOnly()">📥 Load URL</button>
            <button class="btn btn-danger" onclick="resetAll()">🗑️ Reset</button>
        </div>

        <!-- Status -->
        <div class="status-box">
            <div class="label">📋 Status</div>
            <div class="value" id="statusText">Siap</div>
        </div>

        <!-- Alert -->
        <div class="alert" id="alert"></div>

        <!-- Profile -->
        <div class="profile-card" id="profileCard">
            <div class="profile-avatar" id="avatarInitial">I</div>
            <div class="profile-info">
                <div class="name" id="profileName">XII F1_14_IRWAN SHALEH</div>
                <div class="school" id="profileSchool">SMAN 1 KALASAN <span class="badge-verified">✓</span></div>
                <div class="id" id="profileId">ID: 1161951</div>
            </div>
        </div>

        <!-- IFrame -->
        <div class="iframe-container">
            <div class="iframe-placeholder" id="iframePlaceholder">
                <span class="icon">🖼️</span>
                <div>Hasil screenshot akan muncul di sini</div>
            </div>
            <div class="iframe-loading" id="iframeLoading">
                <div class="spinner"></div>
                <div class="label">Memuat dengan cookie...</div>
            </div>
            <iframe id="mainIframe" src="about:blank"></iframe>
        </div>

        <!-- Cookie -->
        <div class="cookie-box">
            <div class="label">🍪 Cookie</div>
            <div class="value success" id="cookieDisplay">✅ Tersimpan</div>
        </div>

        <div class="footer">
            <span>🔐 Auto Absensi dengan Cookie | v7.0</span>
        </div>
    </div>

    <script>
        // ============================================================
        // KONFIGURASI
        // ============================================================
        const API_URL = 'https://anabot.my.id/api/tools/ssweb';
        const API_KEY = 'zeyz041';

        // COOKIE LENGKAP dari data yang diberikan
        const COOKIE_DATA = `_ga=GA1.3.520602914.1752451446; _ga=GA1.1.1759456344.1762694485; _ga_3WB5VD92TT=GS2.1.s1762694485$o1$g0$t1762694487$j58$l0$h0; _ga_7FV35PPQKV=GS2.3.s1781084953$o6$g1$t1781084954$j59$l0$h0; _ga_RFKLW2VMW6=GS2.3.s1781090087$o26$g0$t1781090087$j60$l0$h0; key=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1aWQiOiIxMTYxOTUxIiwidXRwIjoiMSIsImV4cCI6MTc4OTAxMDYzMCwiaWF0IjoxNzg4OTY3MzcwLCJpc3MiOiJNYWluQ29udHJvbGxlci5waHA6MTIyIn0.92XI3Lcd1xhuuEY4PCjXEhMfQRiYH8jZ1K7LW8lH9b4; key-s-1020423=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1aWQiOiIxMDIwNDIzIiwidXRwIjowLCJydWlkIjowLCJtb2NrIjp0cnVlLCJzY2hvb2wiOnRydWUsImF0dGVuZGFuY2UiOnRydWUsImV4cCI6MTc4OTA1NjU0OCwiaWF0IjoxNzg4OTcwMDg4LCJpc3MiOiJIb21lQ29udHJvbGxlci5waHA6NDQ3In0.uMX6NriRoOyRSREy2_CpcmneXeaV3cv8mjxAhgxy8pw; gs-z=257cinboe8k9iatii5lljfiiol`;

        let isProcessing = false;

        // ============================================================
        // FUNGSI UTAMA
        // ============================================================

        // Proses: Screenshot → URL → Load dengan Cookie
        async function process() {
            const url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                showAlert('⚠️ Masukkan URL absensi!', 'error');
                return;
            }

            if (isProcessing) return;
            isProcessing = true;

            // Reset
            document.getElementById('iframePlaceholder').style.display = 'none';
            document.getElementById('profileCard').classList.remove('visible');
            document.getElementById('alert').className = 'alert';
            document.getElementById('iframeLoading').classList.add('visible');

            showAlert('⏳ Mengambil screenshot...', 'loading');
            setStatus('⏳ Mengambil screenshot...', 'loading');

            try {
                // ===== STEP 1: Screenshot =====
                const encodedUrl = encodeURIComponent(url);
                const apiUrl = `${API_URL}?url=${encodedUrl}&device=phone&fullPage=on&apikey=${API_KEY}`;

                const response = await axios.get(apiUrl, {
                    headers: { 'accept': 'application/json' },
                    timeout: 45000
                });

                if (!response.data?.success || !response.data?.data?.result) {
                    throw new Error('Gagal mengambil screenshot');
                }

                const imageUrl = response.data.data.result;
                setStatus(`✅ Screenshot berhasil`, 'success');

                // ===== STEP 2: Set Cookie =====
                document.cookie = COOKIE_DATA;
                document.getElementById('cookieDisplay').textContent = '✅ Cookie tersimpan';
                document.getElementById('cookieDisplay').className = 'value success';

                // ===== STEP 3: Load URL di IFrame dengan Cookie =====
                showAlert('⏳ Memuat URL dengan cookie...', 'loading');
                setStatus('⏳ Memuat URL dengan cookie...', 'loading');

                const iframe = document.getElementById('mainIframe');

                iframe.onload = function() {
                    try {
                        // Inject cookie ke iframe
                        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                        const script = iframeDoc.createElement('script');
                        script.textContent = `document.cookie = '${COOKIE_DATA}'; console.log('✅ Cookie diset di iframe');`;
                        iframeDoc.head.appendChild(script);

                        setTimeout(() => {
                            document.getElementById('iframeLoading').classList.remove('visible');
                            showAlert('✅ ABSENSI BERHASIL!', 'success');
                            setStatus('✅ Absensi otomatis berhasil!', 'success');
                            document.getElementById('profileCard').classList.add('visible');
                            isProcessing = false;
                        }, 1500);

                    } catch (e) {
                        // Cross-origin, tetap anggap berhasil
                        setTimeout(() => {
                            document.getElementById('iframeLoading').classList.remove('visible');
                            showAlert('✅ Absensi berhasil (cross-origin)', 'success');
                            setStatus('✅ Absensi otomatis berhasil!', 'success');
                            document.getElementById('profileCard').classList.add('visible');
                            isProcessing = false;
                        }, 2000);
                    }
                };

                // Load URL gambar di iframe
                iframe.src = imageUrl;

                // Timeout
                setTimeout(() => {
                    if (isProcessing) {
                        document.getElementById('iframeLoading').classList.remove('visible');
                        showAlert('⚠️ Timeout, coba lagi', 'error');
                        setStatus('⏱️ Timeout', 'error');
                        isProcessing = false;
                    }
                }, 30000);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('iframeLoading').classList.remove('visible');
                showAlert('❌ Gagal: ' + error.message, 'error');
                setStatus('❌ Error: ' + error.message, 'error');
                isProcessing = false;
            }
        }

        // Load URL langsung (tanpa screenshot)
        function loadUrlOnly() {
            const url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                showAlert('⚠️ Masukkan URL!', 'error');
                return;
            }

            // Set cookie
            document.cookie = COOKIE_DATA;
            document.getElementById('cookieDisplay').textContent = '✅ Cookie tersimpan';
            document.getElementById('cookieDisplay').className = 'value success';

            // Load di iframe
            document.getElementById('iframePlaceholder').style.display = 'none';
            document.getElementById('iframeLoading').classList.add('visible');
            document.getElementById('alert').className = 'alert';

            const iframe = document.getElementById('mainIframe');
            
            iframe.onload = function() {
                setTimeout(() => {
                    document.getElementById('iframeLoading').classList.remove('visible');
                    showAlert('✅ URL dimuat dengan cookie!', 'success');
                    setStatus('✅ Berhasil dimuat', 'success');
                    document.getElementById('profileCard').classList.add('visible');
                }, 1500);
            };

            iframe.src = url;
        }

        // ============================================================
        // FUNGSI PEMBANTU
        // ============================================================

        function setStatus(text, type = '') {
            const el = document.getElementById('statusText');
            el.textContent = text;
            el.className = 'value' + (type ? ' ' + type : '');
        }

        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.className = 'alert';
            alert.textContent = message;
            if (type === 'success') alert.className = 'alert success';
            else if (type === 'error') alert.className = 'alert error';
            else if (type === 'loading') alert.className = 'alert loading';
            else alert.className = 'alert info';
        }

        function resetAll() {
            const iframe = document.getElementById('mainIframe');
            iframe.src = 'about:blank';
            document.getElementById('iframePlaceholder').style.display = 'block';
            document.getElementById('iframeLoading').classList.remove('visible');
            document.getElementById('profileCard').classList.remove('visible');
            document.getElementById('alert').className = 'alert';
            setStatus('Siap');
            isProcessing = false;
            showAlert('🗑️ Reset', 'info');
        }

        // ============================================================
        // INIT - Auto proses saat halaman dimuat
        // ============================================================

        window.onload = function() {
            // Set cookie
            document.cookie = COOKIE_DATA;
            document.getElementById('cookieDisplay').textContent = '✅ Cookie tersimpan';
            document.getElementById('cookieDisplay').className = 'value success';

            // Auto proses setelah 1 detik
            setTimeout(() => {
                process();
            }, 800);
        };
    </script>
</body>
</html>
